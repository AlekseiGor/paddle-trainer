name: Supabase Watchdog

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping paddle trainer database
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull cloud profile
        shell: bash
        run: |
          node <<'NODE'
          const { createHash } = require("crypto");
          const { readFileSync } = require("fs");

          const config = readFileSync("sync-config.js", "utf8");
          const readConfigValue = (name) => {
            const match = config.match(new RegExp(`${name}:\\s*"([^"]+)"`));
            return match ? match[1].trim() : "";
          };

          const supabaseUrl = readConfigValue("supabaseUrl");
          const supabaseAnonKey = readConfigValue("supabaseAnonKey");
          const syncKey = readConfigValue("syncKey");

          if (!supabaseUrl || !supabaseAnonKey || !syncKey) {
            throw new Error("sync-config.js is missing Supabase settings");
          }

          async function main() {
            const profileHash = createHash("sha256").update(syncKey).digest("hex");
            const response = await fetch(`${supabaseUrl}/rest/v1/rpc/paddle_pull_profile`, {
              method: "POST",
              headers: {
                apikey: supabaseAnonKey,
                Authorization: `Bearer ${supabaseAnonKey}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ p_profile_hash: profileHash })
            });

            if (!response.ok) {
              const text = await response.text();
              throw new Error(`Supabase watchdog failed: ${response.status} ${text.slice(0, 300)}`);
            }

            const profile = await response.json();
            console.log(`Supabase watchdog ok. Rows: ${Array.isArray(profile) ? profile.length : 0}`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
